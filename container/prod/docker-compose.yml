version: "3.8"

name: "coalb_prod"

services:
    db:
        container_name: coalb_db
        image: postgres:10
        restart: always
        volumes:
            - ../../pgdata/db:/var/lib/postgresql/data
            - ../../pgdata/backup:/backup
        env_file:
            - ../../src/envs/prod.env
        networks:
            - backend_db

    web:
        container_name: coalb_web
        image: coalb-img
        build:
            context: ../../
            dockerfile: container/prod/Dockerfile
        restart: always
        expose:
            - 8000
        command: /code/scripts/start.sh
        entrypoint: /code/scripts/entrypoint.sh
        volumes:
            - ../../src/fixtures:/code/fixtures
            - ../../src/envs:/code/envs
            - ../../src/static:/code/static
            - ../../src/staticfiles:/code/staticfiles
            - ../../src/media:/code/media
            - ../../src/logs:/code/logs
            - ../../src/backup:/code/backup
        depends_on:
            - db
        networks:
            - frontend
            - backend_db
            - backend_app

    selenium:
        container_name: coalb_selenium
        image: seleniarm/standalone-chromium:123.0
        restart: always
        networks:
            - backend_app

    nginx:
        container_name: coalb_nginx
        image: nginx:latest
        restart: always
        ports:
            - 8000:80
            # - 4400:443
        volumes:
            - ./nginx/ssl:/etc/letsencrypt
            - ./nginx/logs:/var/log/nginx
            - ./nginx/conf.d:/etc/nginx/conf.d
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
            - ../../src/staticfiles:/code/staticfiles
            - ../../src/media:/code/media
        networks:
            - frontend

    redis:
        container_name: coalb_rd
        image: redis:5
        restart: always
        volumes:
            - ./redis/data:/data
        depends_on:
            - web
        networks:
            - backend_app

    celery_worker:
        container_name: coalb_wk
        image: coalb-img
        restart: always
        command: celery -A core worker --concurrency=2 -l info -n worker1@%h
        volumes:
            - ../../src/envs:/code/envs
        depends_on:
            - redis
        networks:
            - backend_db
            - backend_app

# volumes:
#     staticfiles:
#         name: coalb-web-staticfiles

networks:
    frontend:
        name: coalb-frontend-network
    backend_db:
        name: coalb-backend-network
    backend_app:
        name: coalb-backend-app-network
